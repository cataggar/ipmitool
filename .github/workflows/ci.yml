# CI for the incremental Zig rewrite (tracking issue #2, this workflow is #6).
#
# Upstream ipmitool is hosted on Codeberg and gated by Woodpecker CI
# (.woodpecker.yml); that configuration does not apply to this GitHub fork, so
# this is a native GitHub Actions replacement rather than a port of it.
#
# Design notes:
#   * Every job below is a separate status context so that `protect-main` can
#     require them individually.
#   * Third-party and first-party actions are pinned to a commit SHA; dependabot
#     (.github/dependabot.yml) keeps the pins fresh.
#   * The Zig toolchain is pinned to a single version in one place (ZIG_VERSION).
#   * Nothing here hardcodes a list of .zig files: `fmt` derives the file set
#     from `git ls-files`, and `build`/`test` go through `zig build`, so the
#     workflow keeps working unchanged as the C sources are replaced by Zig
#     under new directories in later phases.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly, so runner-image and toolchain drift surfaces even when there are
    # no pull requests open.
    - cron: '17 6 * * *'
  workflow_dispatch:

# Read-only: no job here publishes anything back to the repository.
permissions:
  contents: read
  attestations: read

concurrency:
  # One in-flight run per pull request / per branch. Superseded pull request
  # runs are cancelled; pushes to main are left alone so every commit on main
  # keeps a complete result.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The one place the toolchain version is pinned. build.zig.zon also declares
  # .minimum_zig_version = "0.16.0".
  ZIG_VERSION: '0.16.0'
  # Keep Zig's global and local build caches together in the workspace so the
  # build and test jobs can persist them explicitly.
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  # System packages required by the default `zig build` configuration:
  #   libssl-dev      -> libcrypto, for -Dopenssl (RMCP+ crypto, SHA256/MD5)
  #   libreadline-dev -> libreadline, for -Dipmishell (the `shell`/`exec` cmds)
  #   pkg-config      -> how build.zig locates readline
  BUILD_APT_PACKAGES: 'libssl-dev libreadline-dev pkg-config'

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Install Zig ${{ env.ZIG_VERSION }} via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v${{ env.ZIG_VERSION }}
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Verify Zig version
        run: test "$(zig version)" = "${ZIG_VERSION}"

      - name: zig fmt --check
        run: |
          set -euo pipefail
          # Tracked .zig files at any depth. New Zig sources added by later
          # migration phases are picked up automatically; build outputs
          # (zig-out/, .zig-cache/) are untracked and therefore excluded.
          mapfile -d '' -t files < <(git ls-files -z -- '*.zig')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no tracked .zig files found; the fmt gate would be a no-op"
            exit 1
          fi
          printf 'checking %d file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          zig fmt --check "${files[@]}"

  build:
    name: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          # build.zig derives the version string from `git describe --tags`,
          # mirroring ./csv-revision, so fetch the whole history and the tags.
          # NOTE: no tags are pushed to this fork today, so both fall back to
          # their snapshot version; this starts reporting the real revision on
          # its own once tags are pushed.
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # shellcheck disable=SC2086  # deliberate word splitting of the list
          sudo apt-get install -y --no-install-recommends ${BUILD_APT_PACKAGES}

      - name: Install Zig ${{ env.ZIG_VERSION }} via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v${{ env.ZIG_VERSION }}
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Verify Zig version
        run: test "$(zig version)" = "${ZIG_VERSION}"

      - name: Restore Zig build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          # A unique suffix lets each successful run save its refreshed cache.
          # The restore prefix reuses the newest cache for this exact toolchain,
          # platform, job, and build definition.
          key: >-
            zig-cache-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-zig-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            zig-cache-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-zig-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon') }}-

      - name: zig build
        run: zig build --summary all

      - name: Smoke-check the built binaries
        run: |
          set -euo pipefail
          test -x zig-out/bin/ipmitool
          test -x zig-out/sbin/ipmievd
          echo "--- ipmitool -V ---"
          zig-out/bin/ipmitool -V
          echo "--- ipmievd -V ---"
          zig-out/sbin/ipmievd -V
          # -h exits 0 and writes the usage (including the interface list) to
          # stderr; byte-parity of this output with the autotools oracle is a
          # load-bearing property of the migration.
          echo "--- ipmitool -h ---"
          zig-out/bin/ipmitool -h
          echo "--- ipmievd -h ---"
          zig-out/sbin/ipmievd -h
          # Installed data files, as produced by `zig build`.
          test -f zig-out/share/man/man1/ipmitool.1
          test -f zig-out/share/man/man8/ipmievd.8
          test -d zig-out/share/ipmitool/contrib

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ipmitool-${{ matrix.os }}
          path: zig-out/
          if-no-files-found: error
          retention-days: 14

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # shellcheck disable=SC2086  # deliberate word splitting of the list
          sudo apt-get install -y --no-install-recommends ${BUILD_APT_PACKAGES}

      - name: Install Zig ${{ env.ZIG_VERSION }} via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v${{ env.ZIG_VERSION }}
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Verify Zig version
        run: test "$(zig version)" = "${ZIG_VERSION}"

      - name: Restore Zig build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: >-
            zig-cache-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-zig-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            zig-cache-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-zig-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon') }}-

      - name: zig build test
        run: zig build test --summary all

      - name: Test and build opt-in Zig USB transport
        run: |
          zig build test-usb -Dintf-usb=true -Dzig-modules=usb --summary all
          zig build -Dintf-usb=true -Dzig-modules=usb --summary all

      - name: Golden tests with lanplus, OpenSSL, and shell disabled
        # The all-Zig comparison selects every port, including disabled
        # interfaces; these cases must still link without lanplus's C tables.
        run: >-
          zig build test-golden -Dipmishell=false -Dopenssl=false
          -Dinternal-md5=true -Dintf-lanplus=false -Dzig-modules=sdr,sel
          --summary all -- --filter sl_

  oracle:
    # Differential-testing reference build (issue #3). The autotools build is
    # the oracle every Zig port stage is diffed against, so it has to keep
    # working until the C sources are deleted in issue #13. It costs about a
    # minute, which is cheap enough to gate every pull request on rather than
    # deferring to a nightly-only job.
    name: oracle (autotools cross-check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # shellcheck disable=SC2086  # deliberate word splitting of the list
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool ${BUILD_APT_PACKAGES}

      - name: scripts/build-oracle.sh
        env:
          ORACLE_DIR: ${{ runner.temp }}/ipmitool-oracle
        run: scripts/build-oracle.sh

      - name: Smoke-check the oracle binaries
        env:
          ORACLE_DIR: ${{ runner.temp }}/ipmitool-oracle
        run: |
          set -euo pipefail
          "$ORACLE_DIR/ipmitool" -V
          "$ORACLE_DIR/ipmievd" -V
          cat "$ORACLE_DIR/metadata.txt"
          # Stage inside the workspace so the upload path is workspace relative.
          mkdir -p oracle-artifact
          cp -a "$ORACLE_DIR/." oracle-artifact/

      - name: Upload oracle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oracle-ubuntu-latest
          path: oracle-artifact/
          if-no-files-found: error
          retention-days: 14
